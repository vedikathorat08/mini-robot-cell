services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    stop_grace_period: 10s
    restart: unless-stopped
    volumes:
      - /dev:/dev
    device_cgroup_rules:
      - "c 81:* rmw"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    init: true
    ports:
      - "8080:8080"
    depends_on:
      - backend
