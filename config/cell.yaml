rosbridge:
  port: 9090
web:
  port: 8080
camera:
  device: /dev/video0
  width: 1280
  height: 720
  fps: 10
calibration:
  mm_per_pixel: 0.4
conveyor:
  belt_speed_mps: 0.25
  latency_ms: 200
home_pose_rad: [0.0, -1.57, 1.57, -1.57, -1.57, 0.0]
robot:
  urdf_path: /app/backend/urdf/ur5e.urdf
  state_rate_hz: 30
camera_http:
  port: 8081
pick_target:
  units: mm
table:
  center_m: [0.4, 0.0]   # table centre in base_link (x forward, y left)
  size_m: [0.9, 0.7]
camera_pose:
  height_m: 0.8          # overhead camera above the table centre, looking down